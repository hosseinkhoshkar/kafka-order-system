server:
  port: 8082

spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:postgresql://localhost:5433/inventorydb
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: inventory-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.example.common.event.EventEnvelope

kafka:
  topic:
    orders: orders
    orders-dlt: orders.DLT
    inventory-reply: inventory-reply
    inventory-reply-dlt: inventory-reply.DLT
  consumer:
    group:
      inventory: inventory-group
      inventory-dlt: inventory-group-dlt
    error:
      max-attempts: 3
      backoff-ms: 1000
      dlt-send-timeout: PT10S

inventory:
  outbox:
    relay:
      poll-interval-ms: 5000
      batch-size: 25
      lease-duration: PT2M
      initial-backoff: PT2S
      max-backoff: PT1M
      max-attempts: 5

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  health:
    diskspace:
      enabled: false
    probes:
      enabled: true
    group:
      liveness:
        include: livenessState,ping
      readiness:
        include: readinessState,db,kafka

observability:
  kafka:
    health-timeout-ms: 1000
  outbox:
    metrics-refresh-ms: 10000

logging:
  pattern:
    level: "%5p [orderId:%X{orderId:-} eventId:%X{eventId:-} correlationId:%X{correlationId:-}]"
