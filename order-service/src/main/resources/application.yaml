server:
  port: 8081

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://localhost:5432/orderdb
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

kafka:
  topic:
    orders: orders
    orders-dlt: orders.DLT
    inventory-reply: inventory-reply
    inventory-reply-dlt: inventory-reply.DLT
  consumer:
    group:
      order: order-group
      order-dlt: order-group-dlt
    error:
      max-attempts: 3
      backoff-ms: 1000
      dlt-send-timeout: PT10S

outbox:
  relay:
    poll-interval-ms: 5000
    batch-size: 25
    lease-duration: PT2M
    initial-backoff: PT2S
    max-backoff: PT1M
    max-attempts: 5
