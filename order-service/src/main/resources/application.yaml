server:
  port: 8081

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://localhost:5432/orderdb
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

kafka:
  topic:
    orders: orders
    orders-dlt: orders.DLT
    inventory-reply: inventory-reply
    inventory-reply-dlt: inventory-reply.DLT
  consumer:
    group:
      order: order-group
      order-dlt: order-group-dlt
    error:
      max-attempts: 3
      backoff-ms: 1000
      dlt-send-timeout: PT10S

outbox:
  relay:
    poll-interval-ms: 5000
    batch-size: 25
    lease-duration: PT2M
    initial-backoff: PT2S
    max-backoff: PT1M
    max-attempts: 5

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  health:
    diskspace:
      enabled: false
    probes:
      enabled: true
  metrics:
    distribution:
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s,5s

observability:
  outbox:
    metrics-refresh-ms: 10000

logging:
  pattern:
    level: "%5p [orderId:%X{orderId:-} eventId:%X{eventId:-} correlationId:%X{correlationId:-}]"
